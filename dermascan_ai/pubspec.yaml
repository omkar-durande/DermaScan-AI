name: dermascan_ai
description: "DermaScan AI — AI-powered skin disease detection app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0

  # Networking
  http: ^1.6.0
  http_parser: ^4.1.2

  # Image & Camera
  image_picker: ^1.2.2
  camera: ^0.12.0+1
  cached_network_image: ^3.4.1
  path_provider: ^2.1.1
  image: ^4.1.3

  # Location & Maps (Mapbox via flutter_map)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3

  # Charts
  fl_chart: ^1.2.0

  # State Management
  provider: ^6.1.5+1

  # Local Storage
  shared_preferences: ^2.5.5

  # Animations
  lottie: ^3.3.3

  # Permissions
  permission_handler: ^12.0.3

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.2

  # PDF Export
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
